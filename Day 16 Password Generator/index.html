<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome to Day 16</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">

    <h1>🔐Password Generator</h1>

     <div class="password-container">
       
      <input type="text" id="password" readonly placeholder="Your password will appear here">

    
    </div>

    <button onclick="generatePassword()">
      Generate Password
    </button>

    <button onclick="togglePassword()" id="show-pass">
      👁️ Show Password
    </button>

    <button onclick="copyPassword()" id="copy-btn" class="copy-btn">
    📋 Copy Password
</button>

<p id="message"></p>

  </div>
  
</body>
<script src="script.js"></script>
</html>
